<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    <title>NFC Arcade</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: #000;
            color: #fff;
            overflow: hidden;
            font-family: Arial, sans-serif;
            position: fixed;
            top: 0;
            left: 0;
        }
        #display {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            position: absolute;
            top: 0;
            left: 0;
            border: 0;
        }
        #display iframe,
        #display canvas,
        #display video {
            width: 100vw !important;
            height: 100vh !important;
            height: 100dvh !important;
            border: 0 !important;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <div id="display"></div>
    <script>
        const display = document.getElementById('display');
        const urlParams = new URLSearchParams(window.location.search);
        const gameKey = urlParams.get('rom') || urlParams.get('game') || 'supermarioworld';

        const ROMS = {
            "michaeljacksonmd": {
                "url": "https://derekcrato.github.io/nfcteste/Michael Jackson Moonwalker.bin",
                "system": "genesis_plus_gx",
                "name": "Michael Jackson's Moonwalker"
            },
            "pokemonblue": {
                "url": "https://derekcrato.github.io/nfcteste/Pokemon - Blue Version.gb",
                "system": "gambatte",
                "name": "Pokemon Blue"
            },
            "pokemonfirered": {
                "url": "https://derekcrato.github.io/nfcteste/Pokemon - FireRed.gba",
                "system": "mgba",
                "name": "Pokemon Fire Red"
            },
            "pokemonred": {
                "url": "https://derekcrato.github.io/nfcteste/Pokemon - Red Version.gb",
                "system": "gambatte",
                "name": "Pokemon Red"
            },
            "pokemonyellow": {
                "url": "https://derekcrato.github.io/nfcteste/Pokemon - Yellow Version.gbc",
                "system": "gambatte",
                "name": "Pokemon Yellow"
            },
            "sapoxule": {
                "url": "https://derekcrato.github.io/nfcteste/Sapo Xule vs. Os Invasores do Brejo.bin",
                "system": "smsplus",
                "name": "Sapo Xule vs. Os Invasores do Brejo"
            },
            "bomberman5": {
                "url": "https://derekcrato.github.io/nfcteste/Super Bomberman 5.sfc",
                "system": "snes9x",
                "name": "Super Bomberman 5"
            },
            "supermariobors3": {
                "url": "https://derekcrato.github.io/nfcteste/Super Mario Bros. 3 (USA).nes",
                "system": "fceumm",
                "name": "Super Mario Bros 3"
            },
            "supermarioworld": {
                "url": "https://derekcrato.github.io/nfcteste/Super Mario World (USA).sfc",
                "system": "snes9x",
                "name": "Super Mario World"
            }
        };

        (function initGame() {
            const gameData = ROMS[gameKey];
            if (!gameData) {
                display.innerHTML = '<p style="color:red;text-align:center;padding:20px;">Jogo nao encontrado: ' + gameKey + '</p>';
                return;
            }

            window.EJS_player = '#display';
            window.EJS_core = gameData.system || 'snes9x';
            window.EJS_gameUrl = gameData.url;
            window.EJS_gameName = gameKey;
            window.EJS_startOnLoaded = true;
            window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
            window.EJS_color = '#000000';

            const script = document.createElement('script');
            script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
            script.onerror = function() {
                display.innerHTML = '<p style="color:red;text-align:center;padding:20px;">Erro ao carregar emulador</p>';
            };
            document.body.appendChild(script);

            if (typeof EJS_setSaveData === 'function') {
                window.addEventListener('EJS_ready', function onReady() {
                    try {
                        const saved = localStorage.getItem('EJS_SAVE_SRAM_' + gameKey);
                        if (saved) {
                            const sramData = JSON.parse(saved);
                            EJS_setSaveData(sramData);
                        }
                    } catch(e) {}
                    window.removeEventListener('EJS_ready', onReady);
                });
            }

            setInterval(function() {
                try {
                    if (typeof EJS_saveSRAM === 'function') EJS_saveSRAM();
                    if (typeof EJS_getSaveData === 'function') {
                        const sramData = EJS_getSaveData();
                        if (sramData) localStorage.setItem('EJS_SAVE_SRAM_' + gameKey, JSON.stringify(sramData));
                    }
                } catch(e) {}
            }, 30000);
            window.addEventListener('beforeunload', function() {
                try {
                    if (typeof EJS_saveSRAM === 'function') EJS_saveSRAM();
                    if (typeof EJS_getSaveData === 'function') {
                        const sramData = EJS_getSaveData();
                        if (sramData) localStorage.setItem('EJS_SAVE_SRAM_' + gameKey, JSON.stringify(sramData));
                    }
                } catch(e) {}
            });
        })();
    </script>
</body>
</html>
